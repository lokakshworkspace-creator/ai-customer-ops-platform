[project]
name = "ops-platform-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "redis>=5.0",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "aiokafka>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]
addopts = "--strict-markers"
# A hung test fails (or, on Windows, aborts the run with a stack dump) instead of hanging forever.
timeout = 180
markers = [
    "kafka: needs the Redpanda from docker-compose (added automatically to every test that uses the kafka_env fixture); deselect with -m \"not kafka\"",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Security",
    "app.api.deps.require_role",
]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/versions/*" = ["E501", "I001", "UP007"]
"app/api/routers/refunds.py" = ["E501"]  # wide markdown table in the OpenAPI description
"../scripts/demo_phase2.py" = ["E501"]  # human-readable output strings
